<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C++ 视频播放器</title>
    <link rel="stylesheet" href="renderer/index.css">
</head>
<body>
    <div class="main-area">
        <div class="player-section" id="player-section">
            <div class="video-wrapper">
                <canvas id="canvas" width="640" height="360"></canvas>
            </div>

            <div class="controls">
                <div class="ctrl-left">
                    <span class="tc tc-cur" id="time-current">00:00:00:00</span>
                    <span class="tc-sep">/</span>
                    <span class="tc" id="time-total">00:00:00:00</span>
                </div>
                <div class="ctrl-center">
                    <button class="btn-icon" id="btn-play" disabled title="播放/暂停">&#9654;</button>
                </div>
                <div class="ctrl-right">
                    <button class="btn-icon" id="btn-test" title="加载测试项目">&#9881;</button>
                </div>
            </div>
        </div>
        
        <div class="divider-h" id="divider-h"></div>
        <div id="timeline"></div>
    </div>

    <div class="divider-v" id="divider-v"></div>

    <div class="log-section" id="log-section">
        <div class="log-inner">
            <div class="log-header">
                <span>日志</span>
                <span id="file-info">未加载</span>
                <button class="log-fold" id="log-fold" title="折叠">&raquo;</button>
            </div>
            <div class="log-content" id="log-content"></div>
        </div>
    </div>

    <button class="log-expand" id="log-expand" title="展开日志">&laquo;</button>

    <script>require('./renderer/main.js')</script>
</body>
</html>
