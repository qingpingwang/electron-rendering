<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C++ 着色器绘制到 Canvas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, monospace;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 上部：标题 + 状态 + 控制 */
        .header {
            padding: 10px 14px;
            background: #12121f;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .header h1 {
            color: #00d4ff;
            font-size: 1rem;
        }
        
        .status {
            font-size: 0.7rem;
            color: #888;
        }
        .status.ok { color: #2ecc71; }
        .status.err { color: #e74c3c; }
        
        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        button {
            font-family: inherit;
            font-size: 0.75rem;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.98); }
        
        .btn-red { background: #e74c3c; color: white; }
        .btn-blue { background: #3498db; color: white; }
        .btn-green { background: #2ecc71; color: white; }
        .btn-yellow { background: #f1c40f; color: #333; }
        .btn-purple { background: #9b59b6; color: white; }
        .btn-gray { background: #636e72; color: white; }

        /* 中部：Canvas */
        .canvas-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            min-height: 0;
        }
        
        .canvas-container {
            background: #0d0d1a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 6px;
        }
        
        #target-canvas {
            display: block;
            background: #000;
            border-radius: 4px;
        }

        /* 下部：日志 */
        .log-section {
            height: 150px;
            flex-shrink: 0;
            background: #0d0d1a;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        
        .log-header {
            padding: 6px 10px;
            font-size: 0.7rem;
            color: #666;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        
        #log {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
            font-size: 0.65rem;
            color: #888;
        }
        
        #log::-webkit-scrollbar { width: 5px; }
        #log::-webkit-scrollbar-track { background: #1a1a2e; }
        #log::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        .log-ok { color: #2ecc71; }
        .log-err { color: #e74c3c; }
        .log-item { padding: 1px 0; }
    </style>
</head>
<body>
    <!-- 上部：标题 + 状态 + 控制 -->
    <div class="header">
        <div class="header-row">
            <h1>⚡ C++ OpenGL → Canvas</h1>
            <div class="status" id="status">初始化中...</div>
        </div>
        <div class="controls">
            <button class="btn-red" onclick="render({r:1,g:0,b:0,a:1})">🔴 红</button>
            <button class="btn-blue" onclick="render({r:0,g:0.5,b:1,a:1})">🔵 蓝</button>
            <button class="btn-green" onclick="render({r:0.2,g:0.9,b:0.4,a:1})">🟢 绿</button>
            <button class="btn-yellow" onclick="render({r:1,g:0.9,b:0.2,a:1})">🟡 黄</button>
            <button class="btn-purple" onclick="render({r:0.6,g:0.3,b:0.9,a:1})">🟣 紫</button>
            <button class="btn-gray" onclick="clear2d()">清空</button>
        </div>
    </div>

    <!-- 中部：Canvas -->
    <div class="canvas-section">
        <div class="canvas-container">
            <canvas id="target-canvas" width="480" height="220"></canvas>
        </div>
    </div>

    <!-- 下部：日志 -->
    <div class="log-section">
        <div class="log-header">📋 运行日志</div>
        <div id="log"></div>
    </div>

    <script>
        let addon = null;
        let canvas, ctx;

        function log(msg, type = '') {
            const el = document.getElementById('log');
            const t = new Date().toLocaleTimeString();
            el.innerHTML = `<div class="log-item log-${type}">[${t}] ${msg}</div>` + el.innerHTML;
        }

        function setStatus(msg, ok = true) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + (ok ? 'ok' : 'err');
        }

        function render(color) {
            if (!addon) {
                log('Addon 未加载', 'err');
                return;
            }

            const t0 = performance.now();
            
            try {
                const pixels = addon.render(canvas.width, canvas.height, color);
                const t1 = performance.now();
                
                const imageData = new ImageData(
                    new Uint8ClampedArray(pixels.buffer, pixels.byteOffset, pixels.length),
                    canvas.width,
                    canvas.height
                );
                ctx.putImageData(imageData, 0, 0);
                
                const t2 = performance.now();
                log(`✓ GPU: ${(t1-t0).toFixed(1)}ms, 上屏: ${(t2-t1).toFixed(1)}ms`, 'ok');
                
            } catch (e) {
                log(`✗ ${e.message}`, 'err');
            }
        }

        function clear2d() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            log('已清空');
        }

        async function init() {
            log('初始化...');
            
            canvas = document.getElementById('target-canvas');
            ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            try {
                addon = require('./build/Release/skia_render');
                log('Addon 已加载');
                
                addon.init();
                log('OpenGL 已初始化');
                
                const info = addon.getInfo();
                log(`GPU: ${info.renderer}`);
                
                log(`📁 下载目录: ${info.downloadPath}`);
                log(`📄 文件数量: ${info.fileCount}`);
                if (info.files && info.files.length > 0) {
                    info.files.slice(0, 5).forEach(f => {
                        const icon = f.isDir ? '📁' : '📄';
                        const size = f.size ? ` (${(f.size/1024).toFixed(1)}KB)` : '';
                        log(`${icon} ${f.name}${size}`);
                    });
                    if (info.fileCount > 5) {
                        log(`... 还有 ${info.fileCount - 5} 个文件`);
                    }
                }
                
                setStatus(`${info.renderer} | ${canvas.width}x${canvas.height}`);
                render({r: 0.1, g: 0.1, b: 0.15, a: 1});
                
            } catch (e) {
                log(`初始化失败: ${e.message}`, 'err');
                setStatus('初始化失败', false);
            }
        }

        window.onload = init;
        window.onbeforeunload = () => { if (addon) addon.cleanup(); };
    </script>
</body>
</html>
