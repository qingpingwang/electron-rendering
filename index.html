<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C++ 视频播放器</title>
    <link rel="stylesheet" href="renderer/index.css">
</head>
<body>
    <div class="player-section">
        <div class="video-wrapper">
            <canvas id="canvas" width="640" height="360"></canvas>
        </div>
        
        <div class="controls">
            <div class="progress" id="progress">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div class="controls-row">
                <div class="btn-group">
                    <button class="btn-play" id="btn-play" disabled>▶ 播放</button>
                    <button class="btn-stop" id="btn-stop" disabled>■ 停止</button>
                </div>
                <button class="btn-secondary" id="btn-load">📂 加载</button>
                <button class="btn-secondary" id="btn-test">🧪 测试</button>
                
                <div class="time-display">
                    <span class="current" id="time-current">00:00.000</span>
                    <span style="color:#555"> / </span>
                    <span id="time-total">00:00.000</span>
                </div>
            </div>
        </div>
        
        <div class="info-bar">
            <span id="video-info">尺寸: - | 帧率: -</span>
            <span id="project-id">项目: -</span>
            <span id="gpu-info">GPU: -</span>
        </div>
    </div>
    
    <div class="log-section">
        <div class="log-header">
            <span>📋 日志</span>
            <span id="file-info">未加载</span>
        </div>
        <div class="log-content" id="log-content"></div>
    </div>

    <script>require('./renderer/main.js')</script>
</body>
</html>
