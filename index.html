<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C++ 视频播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'SF Mono', 'Menlo', monospace;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ========== 上部：播放器区域 ========== */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #0d0d1a;
        }

        /* 视频容器 - 自适应尺寸 */
        .video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            min-height: 0;
            background: #000;
        }
        
        #canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #111;
            border-radius: 4px;
        }

        /* 控制栏 */
        .controls {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            flex-shrink: 0;
        }
        
        .progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .progress:hover { height: 6px; }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            border-radius: 2px;
            width: 0%;
            transition: width 0.05s linear;
        }
        
        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-group {
            display: flex;
            gap: 6px;
        }
        
        button {
            font-family: inherit;
            font-size: 0.8rem;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
        }
        
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        
        .btn-play {
            background: #4ecdc4;
            color: #000;
            min-width: 70px;
        }
        
        .btn-stop {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .time-display {
            font-size: 0.75rem;
            color: #888;
            font-variant-numeric: tabular-nums;
            margin-left: auto;
        }
        
        .time-display .current { color: #4ecdc4; }

        /* 信息栏 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 16px;
            font-size: 0.7rem;
            color: #555;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ========== 下部：日志区域 ========== */
        .log-section {
            height: 220px;
            flex-shrink: 0;
            background: #12121f;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.7rem;
            color: #666;
        }
        
        .log-header span { color: #4ecdc4; }
        
        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 0.7rem;
            line-height: 1.5;
        }
        
        .log-content div {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        .log-ok { color: #4ecdc4; }
        .log-err { color: #ff6b6b; }
        .log-warn { color: #f1c40f; }
        .log-info { color: #888; }
    </style>
</head>
<body>
    <!-- 上部：播放器 -->
    <div class="player-section">
        <div class="video-wrapper">
            <canvas id="canvas" width="640" height="360"></canvas>
        </div>
        
        <div class="controls">
            <div class="progress" id="progress">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div class="controls-row">
                <div class="btn-group">
                    <button class="btn-play" id="btn-play" disabled>▶ 播放</button>
                    <button class="btn-stop" id="btn-stop" disabled>■ 停止</button>
                </div>
                <button class="btn-secondary" id="btn-load">📂 加载</button>
                <button class="btn-secondary" id="btn-test">🧪 测试</button>
                
                <div class="time-display">
                    <span class="current" id="time-current">00:00.000</span>
                    <span style="color:#555"> / </span>
                    <span id="time-total">00:00.000</span>
                </div>
            </div>
        </div>
        
        <div class="info-bar">
            <span id="video-info">尺寸: - | 帧率: -</span>
            <span id="project-id">项目: -</span>
            <span id="gpu-info">GPU: -</span>
        </div>
    </div>
    
    <!-- 下部：日志 -->
    <div class="log-section">
        <div class="log-header">
            <span>📋 日志</span>
            <span id="file-info">未加载</span>
        </div>
        <div class="log-content" id="log-content"></div>
    </div>

    <script>
        const path = require('path');
        const fs = require('fs');
        
        // ========== 播放器状态 ==========
        const player = {
            addon: null,
            canvas: null,
            ctx: null,
            isPlaying: false,
            currentTime: 0,
            duration: 0,
            frameRate: 0,
            width: 0,
            height: 0,
            animationId: null,
            // 帧计数
            frameCount: 0,
            // 同步播放用
            lastFrameTime: 0       // 上一帧渲染的时间戳
        };

        // ========== 日志 ==========
        function log(msg, type = 'info') {
            const el = document.getElementById('log-content');
            const t = new Date().toLocaleTimeString();
            el.innerHTML += `<div class="log-${type}">[${t}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight; // 滚动到底部
        }

        // ========== 工具函数 ==========
        function formatTime(ms) {
            const sec = Math.floor(ms / 1000);
            const min = Math.floor(sec / 60);
            const s = sec % 60;
            const m = Math.floor(ms % 1000);
            return `${String(min).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(m).padStart(3, '0')}`;
        }

        // ========== UI 更新 ==========
        function updateUI() {
            const $ = id => document.getElementById(id);
            
            $('btn-play').disabled = player.duration === 0;
            $('btn-stop').disabled = player.duration === 0;
            $('btn-play').textContent = player.isPlaying ? '⏸ 暂停' : '▶ 播放';
            
            $('time-current').textContent = formatTime(player.currentTime);
            $('time-total').textContent = formatTime(player.duration);
            
            const progress = player.duration > 0 ? (player.currentTime / player.duration) * 100 : 0;
            $('progress-fill').style.width = `${progress}%`;
            
            if (player.width > 0) {
                $('video-info').textContent = `${player.width}×${player.height} | ${player.frameRate.toFixed(1)}fps | 帧: #${player.frameCount}`;
            }
        }

        // ========== 渲染 ==========
        function render() {
            if (!player.addon) return;
            
            const t0 = performance.now();
            
            // C++ 解码 + GPU 渲染
            player.addon.setCurrentTime(Math.floor(player.currentTime));
            const pixels = player.addon.draw();
            
            const t1 = performance.now();
            
            if (!pixels) return;
            
            // 自适应 Canvas 尺寸
            if (player.canvas.width !== player.width || player.canvas.height !== player.height) {
                player.canvas.width = player.width;
                player.canvas.height = player.height;
                log(`Canvas 调整为 ${player.width}×${player.height}`, 'info');
            }
            
            // 上屏 (C++ 端已处理 Y 轴翻转)
            const imageData = new ImageData(
                new Uint8ClampedArray(pixels.buffer, pixels.byteOffset, pixels.length),
                player.width,
                player.height
            );
            player.ctx.putImageData(imageData, 0, 0);
            
            const t2 = performance.now();
            
            // 帧时间统计
            const renderTime = t1 - t0;  // C++ 渲染时间
            const displayTime = t2 - t1; // 上屏时间
            const totalTime = t2 - t0;   // 总帧时间
            
            player.frameCount++;
            
            // 每帧输出渲染时间
            log(`#${player.frameCount} | ${formatTime(player.currentTime)} | 渲染: ${renderTime.toFixed(2)}ms | 上屏: ${displayTime.toFixed(2)}ms | 总计: ${totalTime.toFixed(2)}ms`, 'info');
        }

        // ========== 播放循环 ==========
        function playLoop(timestamp) {
            if (!player.isPlaying) return;
            
            // 计算帧间隔（基于视频帧率）
            const frameInterval = player.frameRate > 0 ? (1000 / player.frameRate) : 40;
            
            // 检查是否经过了足够时间
            const elapsed = timestamp - player.lastFrameTime;
            if (elapsed < frameInterval) {
                // 还没到下一帧时间，继续等待
                player.animationId = requestAnimationFrame(playLoop);
                return;
            }
            
            // 更新上一帧时间（对齐到帧间隔，避免累积误差）
            player.lastFrameTime = timestamp - (elapsed % frameInterval);
            
            // 增加 currentTime
            player.currentTime += frameInterval;
            
            // 检查是否播放结束
            if (player.currentTime >= player.duration) {
                player.currentTime = player.duration;
                player.isPlaying = false;
                render();
                updateUI();
                log('播放结束', 'ok');
                return;
            }
            
            render();
            updateUI();
            
            // 继续下一帧
            player.animationId = requestAnimationFrame(playLoop);
        }

        // ========== 播放控制 ==========
        function play() {
            if (player.duration === 0) return;
            
            if (player.isPlaying) {
                // 暂停
                player.isPlaying = false;
                if (player.animationId) {
                    cancelAnimationFrame(player.animationId);
                    player.animationId = null;
                }
                log('暂停', 'info');
            } else {
                // 播放
                if (player.currentTime >= player.duration) {
                    player.currentTime = 0;
                }
                player.isPlaying = true;
                player.lastFrameTime = performance.now();  // 初始化帧时间
                player.animationId = requestAnimationFrame(playLoop);
                log('播放', 'ok');
            }
            updateUI();
        }

        function stop() {
            player.isPlaying = false;
            player.currentTime = 0;
            player.frameCount = 0;
            if (player.animationId) {
                cancelAnimationFrame(player.animationId);
                player.animationId = null;
            }
            render();
            updateUI();
            log('停止', 'info');
        }

        function seek(ratio) {
            if (player.duration === 0) return;
            
            player.currentTime = player.duration * Math.max(0, Math.min(1, ratio));
            
            render();
            updateUI();
        }

        // ========== 加载 ==========
        function loadFromConfig(config) {
            document.getElementById('file-info').textContent = '加载中...';
            
            try {
                stop();
                
                const jsonStr = JSON.stringify(config);
                log(`加载配置: ${config.tracks?.length || 0} 轨道`, 'info');
                
                const t0 = performance.now();
                if (!player.addon.load(jsonStr)) {
                    throw new Error('C++ 加载失败');
                }
                const t1 = performance.now();
                
                const info = player.addon.getInfo();
                player.width = info.width;
                player.height = info.height;
                player.duration = info.durationMs;
                player.frameRate = info.frameRate;
                player.currentTime = 0;
                
                document.getElementById('file-info').textContent = `已加载`;
                document.getElementById('project-id').textContent = info.id ? `项目: ${info.id}` : '项目: -';
                document.getElementById('gpu-info').textContent = `GPU: ${info.gpu}`;
                
                log(`✓ 加载成功 (${(t1-t0).toFixed(1)}ms) | ID: ${info.id || '-'} | ${info.width}×${info.height} | ${info.frameRate.toFixed(2)}fps | ${formatTime(info.durationMs)}`, 'ok');
                
                render();
                updateUI();
                
            } catch (e) {
                document.getElementById('file-info').textContent = `错误`;
                log(`✗ ${e.message}`, 'err');
                console.error(e);
            }
        }
        
        async function loadVideo() {
            let filePath = null;
            
            try {
                const { dialog } = require('@electron/remote');
                const result = await dialog.showOpenDialog({
                    title: '选择视频文件',
                    filters: [{ name: '视频', extensions: ['mp4', 'mov', 'avi', 'mkv', 'webm'] }],
                    properties: ['openFile']
                });
                if (!result.canceled && result.filePaths.length > 0) {
                    filePath = result.filePaths[0];
                }
            } catch (e) {
                filePath = await new Promise(resolve => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'video/*';
                    input.onchange = ev => resolve(ev.target.files[0]?.path || null);
                    input.click();
                });
            }
            
            if (!filePath) return;
            
            log(`选择文件: ${path.basename(filePath)}`, 'info');
            
            const config = {
                tracks: [{
                    type: "video",
                    segments: [{
                        material_id: "mat_0",
                        target_timerange: { start: 0, duration: 999999999 }
                    }]
                }],
                materials: {
                    videos: [{
                        id: "mat_0",
                        path: filePath
                    }]
                }
            };
            
            loadFromConfig(config);
        }

        function loadTest() {
            try {
                const testPath = path.join(__dirname, 'test', 'test.json');
                log(`加载测试: ${testPath}`, 'info');
                
                const jsonStr = fs.readFileSync(testPath, 'utf8');
                const config = JSON.parse(jsonStr);
                
                loadFromConfig(config);
                
            } catch (e) {
                log(`✗ 测试加载失败: ${e.message}`, 'err');
                console.error(e);
            }
        }

        // ========== 初始化 ==========
        function init() {
            player.canvas = document.getElementById('canvas');
            player.ctx = player.canvas.getContext('2d');
            
            log('初始化...', 'info');
            
            try {
                player.addon = require('./build/Release/video_player');
                player.addon.init();
                
                const info = player.addon.getInfo();
                document.getElementById('gpu-info').textContent = `GPU: ${info.gpu}`;
                log(`✓ Addon 加载成功 | GPU: ${info.gpu}`, 'ok');
                
            } catch (e) {
                log(`✗ Addon 加载失败: ${e.message}`, 'err');
                console.error(e);
                return;
            }
            
            // 绑定事件
            document.getElementById('btn-play').onclick = play;
            document.getElementById('btn-stop').onclick = stop;
            document.getElementById('btn-load').onclick = loadVideo;
            document.getElementById('btn-test').onclick = loadTest;
            
            // 进度条
            const progress = document.getElementById('progress');
            let dragging = false;
            
            progress.onmousedown = e => {
                dragging = true;
                const rect = progress.getBoundingClientRect();
                seek((e.clientX - rect.left) / rect.width);
            };
            
            document.onmousemove = e => {
                if (!dragging) return;
                const rect = progress.getBoundingClientRect();
                seek((e.clientX - rect.left) / rect.width);
            };
            
            document.onmouseup = () => { dragging = false; };
            
            // 快捷键
            document.onkeydown = e => {
                if (e.code === 'Space') { e.preventDefault(); play(); }
                else if (e.code === 'Escape') stop();
            };
            
            updateUI();
            log('就绪', 'ok');
        }

        window.onload = init;
        window.onbeforeunload = () => player.addon?.cleanup();
    </script>
</body>
</html>
