<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<title>AI 编辑助手</title>
<link rel="stylesheet" href="dist/output.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body class="bg-bg-dark text-slate-200 h-screen overflow-hidden">

    <div id="app" class="flex h-full">

        <!-- Chat Area (flex-1) -->
        <div id="chatPanel" class="flex flex-col flex-1 min-w-0">

            <!-- Header -->
            <header class="flex items-center justify-between px-4 h-11 bg-header-dark border-b border-border-dark shrink-0">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-rounded text-xl text-indigo-400">smart_toy</span>
                    <span class="text-sm font-semibold text-slate-400">AI 编辑助手</span>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btn-toggle-media" title="素材库"
                        class="p-1.5 rounded-lg text-slate-500 hover:text-slate-300 hover:bg-white/5 transition-colors">
                        <span class="material-symbols-rounded text-lg">perm_media</span>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div id="messages" class="overflow-y-auto px-4 py-4 flex flex-col gap-3 scrollbar-thin" style="height: 75%;">
            </div>

            <!-- Resizer -->
            <div id="resizer" class="resizer shrink-0"></div>

            <!-- Input Area -->
            <div class="flex-1 flex flex-col min-h-0 px-4 pb-3 pt-2">
                <div id="input-wrap" class="flex-1 flex items-start gap-2 bg-input-dark border border-border-dark rounded-xl px-3 py-2 focus-within:border-indigo-500/40 transition-colors min-h-0">
                    <textarea id="input" rows="1" placeholder="输入你的编辑需求..."
                        class="flex-1 bg-transparent border-none outline-none text-slate-200 text-sm resize-none leading-relaxed overflow-y-auto placeholder:text-slate-600 font-sans h-full"></textarea>
                    <button id="btn-send" title="发送" disabled
                        class="w-8 h-8 rounded-lg bg-primary hover:bg-indigo-500 text-white flex items-center justify-center transition-all shrink-0 mt-0.5 disabled:opacity-30 disabled:cursor-not-allowed">
                        <span class="material-symbols-rounded text-lg">send</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Media Library Panel (right) -->
        <aside id="mediaPanel" class="w-80 border-l border-border-dark bg-sidebar-dark flex flex-col shrink-0 transition-all duration-200 overflow-hidden relative"
               style="display: none;">
            <!-- Media library content injected by media_library.js -->
        </aside>

    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" style="display: none;">
        <div class="relative max-w-4xl max-h-[85vh] w-full mx-4">
            <button id="btn-close-preview" class="absolute -top-10 right-0 text-slate-400 hover:text-white transition-colors">
                <span class="material-symbols-rounded text-2xl">close</span>
            </button>
            <div id="previewContent" class="bg-sidebar-dark rounded-xl overflow-hidden"></div>
        </div>
    </div>

    <script>require('./chat.js')</script>
</body>
</html>
